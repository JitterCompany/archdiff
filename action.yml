name: archdiff
description: Architecture-level diff of a pull request, uploaded as an HTML page and linked from a PR comment.

inputs:
  site:
    description: Host that serves the pages, e.g. archdiff.example.com
    required: true
  name:
    description: Directory for this repo on the host; pages land in /<name>/pr-<number>/
    required: true
  upload-key:
    description: Private SSH key that may rsync into /<name> on the host
    required: true
  known-hosts:
    description: known_hosts line(s) for the host
    required: true
  upload-user:
    description: SSH user on the host
    default: archdiff-upload

runs:
  using: composite
  steps:
    - name: Check setup
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        SITE: ${{ inputs.site }}
        NAME: ${{ inputs.name }}
        KEY: ${{ inputs.upload-key }}
        KNOWN_HOSTS: ${{ inputs.known-hosts }}
      run: bash "$GITHUB_ACTION_PATH/ci/check.sh"

    - name: Generate
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}
        PR: ${{ github.event.pull_request.number }}
        TITLE: ${{ github.event.pull_request.title }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        SITE: ${{ inputs.site }}
        NAME: ${{ inputs.name }}
      run: |
        base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
        mkdir -p "$RUNNER_TEMP/archdiff"
        python3 -m archdiff "$base" "$HEAD_SHA" \
          --title "#$PR $TITLE" \
          --title-url "$PR_URL" \
          --out "$RUNNER_TEMP/archdiff/index.html" \
          --summary "$RUNNER_TEMP/archdiff-summary.md" \
          --link "https://$SITE/$NAME/pr-$PR/"

    - name: Upload
      shell: bash
      env:
        PR: ${{ github.event.pull_request.number }}
        SITE: ${{ inputs.site }}
        NAME: ${{ inputs.name }}
        UPLOAD_USER: ${{ inputs.upload-user }}
        KEY: ${{ inputs.upload-key }}
        KNOWN_HOSTS: ${{ inputs.known-hosts }}
      run: bash "$GITHUB_ACTION_PATH/ci/upload.sh"

    - name: Comment
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
      run: bash "$GITHUB_ACTION_PATH/ci/comment.sh"
